services:

  mariadb:
    image: mariadb:11
    container_name: dwese-mariadb-users

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dwese
      MARIADB_USER: dwese_user
      MARIADB_PASSWORD: 1234

    ports:
      - "3307:3306"

    volumes:
      - mariadb_users_data:/var/lib/mysql

volumes:
  mariadb_users_data: